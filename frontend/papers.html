<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartQ 试卷管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#172033",
              ocean: "#0E8FA3",
              iris: "#5B6CFF",
              leaf: "#20B486",
              honey: "#F2A93B",
              coral: "#F05D6A",
            },
            boxShadow: {
              soft: "0 18px 50px rgba(23, 32, 51, 0.08)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 text-ink">
    <main class="w-full px-6 py-6">
      <header class="rounded-lg border border-slate-200 bg-white px-5 py-4 shadow-soft">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs font-black uppercase tracking-[0.18em] text-ocean">SmartQ Papers</div>
            <h1 class="mt-2 text-3xl font-black tracking-normal">试卷管理</h1>
            <div class="mt-1 text-sm font-semibold text-slate-500">集中管理未发布、已发布和历史试卷</div>
          </div>
          <div class="flex items-center gap-2">
            <a href="/" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700">返回命题台</a>
            <a href="/proctor.html" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700">监考工作台</a>
          </div>
        </div>
      </header>

      <section class="mt-5 grid grid-cols-[0.75fr_1.25fr] gap-5">
        <div class="grid gap-5">
          <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-soft">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-black">试卷概览</h2>
              <i data-lucide="chart-no-axes-combined" class="h-5 w-5 text-ocean"></i>
            </div>
            <div class="mt-5 grid grid-cols-2 gap-3" data-paper-metrics></div>
          </div>
        </div>

        <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-soft">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-black">已出卷子管理</h2>
              <div class="mt-1 text-xs font-semibold text-slate-500" data-paper-list-summary>加载中</div>
            </div>
            <button data-refresh-papers class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700">
              <i data-lucide="refresh-cw" class="h-4 w-4"></i>
              刷新
            </button>
          </div>
          <div class="mt-5 max-h-[650px] space-y-3 overflow-y-auto pr-1" data-paper-list></div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/assets/papers.js"></script>
  </body>
</html>
