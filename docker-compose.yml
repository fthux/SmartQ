services:
  smartq:
    build: .
    container_name: smartq-mvp
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://edge.ai.minigameland.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SKYISLAND_API_KEY: ${SKYISLAND_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_WIRE_API: ${OPENAI_WIRE_API:-responses}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      SMARTQ_DATA_FILE: /app/runtime/runtime.json
    volumes:
      - smartq-runtime:/app/runtime
    restart: unless-stopped

volumes:
  smartq-runtime:
