<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartQ 监考工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#172033",
              ocean: "#0E8FA3",
              iris: "#5B6CFF",
              leaf: "#20B486",
              honey: "#F2A93B",
              coral: "#F05D6A",
            },
            boxShadow: {
              soft: "0 18px 50px rgba(23, 32, 51, 0.08)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 text-ink">
    <main class="w-full px-6 py-6">
      <header class="rounded-lg border border-slate-200 bg-white px-5 py-4 shadow-soft">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs font-black uppercase tracking-[0.18em] text-ocean">SmartQ Proctor</div>
            <h1 class="mt-2 text-3xl font-black tracking-normal">多人监考工作台</h1>
            <div class="mt-1 text-sm font-semibold text-slate-500">独立管理考生会话、在线状态、风险事件和考试入口</div>
          </div>
          <div class="flex items-center gap-2">
            <a href="/" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700">返回命题台</a>
            <div class="flex items-center gap-2 rounded-lg bg-rose-50 px-3 py-2 text-sm font-black text-coral">
              <i data-lucide="triangle-alert" class="h-4 w-4"></i>
              <span data-risk-count>0 个风险</span>
            </div>
          </div>
        </div>
      </header>

      <section class="mt-5 grid grid-cols-[1.2fr_0.8fr] gap-5">
        <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-soft">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-black">考生会话</h2>
              <div class="mt-1 text-xs font-semibold text-slate-500" data-session-subtitle>加载中</div>
            </div>
            <button data-refresh-proctor class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700">
              <i data-lucide="refresh-cw" class="h-4 w-4"></i>
              刷新
            </button>
          </div>

          <form id="sessionAssignmentForm" class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
            <div class="mb-3 flex items-center justify-between">
              <div>
                <div class="text-sm font-black">分配考生考试</div>
                <div class="mt-1 text-xs font-semibold text-slate-500">创建考生会话并生成可复制的考试入口</div>
              </div>
              <button type="submit" class="flex items-center gap-2 rounded-lg bg-ink px-3 py-2 text-sm font-bold text-white">
                <i data-lucide="user-plus" class="h-4 w-4"></i>
                分配
              </button>
            </div>
            <div class="grid grid-cols-[1fr_1.2fr_110px_96px_96px] gap-3">
              <label class="text-xs font-bold text-slate-600">考生姓名
                <input name="candidate" required value="新考生" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-ink" />
              </label>
              <label class="text-xs font-bold text-slate-600">准考证号
                <input name="ticket" required value="202606239999" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-ink" />
              </label>
              <label class="text-xs font-bold text-slate-600">卷型
                <select name="paper" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-ink">
                  <option>A 卷</option>
                  <option>B 卷</option>
                  <option>专项卷</option>
                  <option>补考卷</option>
                </select>
              </label>
              <label class="text-xs font-bold text-slate-600">开始
                <input name="startTime" value="10:00" pattern="\\d{1,2}:\\d{2}" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-ink" />
              </label>
              <label class="text-xs font-bold text-slate-600">结束
                <input name="endTime" value="11:30" pattern="\\d{1,2}:\\d{2}" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-ink" />
              </label>
            </div>
          </form>

          <div class="mt-5 grid grid-cols-4 gap-3" data-proctor-summary></div>
          <div class="mt-5 grid grid-cols-4 gap-3" data-session-list></div>
        </div>

        <div class="grid gap-5">
          <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-soft">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-black">风险事件流</h2>
              <i data-lucide="activity" class="h-5 w-5 text-coral"></i>
            </div>
            <div class="mt-5 space-y-3" data-event-list></div>
          </div>

          <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-soft">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-black">监控概览</h2>
              <i data-lucide="monitor-check" class="h-5 w-5 text-ocean"></i>
            </div>
            <div class="mt-5 grid grid-cols-2 gap-3" data-proctor-metrics></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/assets/proctor.js"></script>
  </body>
</html>
