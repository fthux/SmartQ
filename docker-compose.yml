services:
  smartq:
    build: .
    container_name: smartq-mvp
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SKYISLAND_API_KEY: ${SKYISLAND_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_WIRE_API: ${OPENAI_WIRE_API:-responses}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      SMARTQ_ADMIN_USER: ${SMARTQ_ADMIN_USER:-admin}
      SMARTQ_ADMIN_PASSWORD: ${SMARTQ_ADMIN_PASSWORD:-123456}
      SMARTQ_ADMIN_ROLE: ${SMARTQ_ADMIN_ROLE:-admin}
      SMARTQ_ADMIN_ACCOUNTS: ${SMARTQ_ADMIN_ACCOUNTS:-}
      SMARTQ_STORAGE_ADAPTER: ${SMARTQ_STORAGE_ADAPTER:-json-file}
      SMARTQ_DATABASE_URL: ${SMARTQ_DATABASE_URL:-}
      SMARTQ_POSTGRES_TABLE: ${SMARTQ_POSTGRES_TABLE:-smartq_runtime}
      SMARTQ_POSTGRES_KEY: ${SMARTQ_POSTGRES_KEY:-default}
      SMARTQ_POSTGRES_SSL: ${SMARTQ_POSTGRES_SSL:-}
      SMARTQ_POSTGRES_TIMEOUT_MS: ${SMARTQ_POSTGRES_TIMEOUT_MS:-3000}
      SMARTQ_LOGIN_MAX_FAILURES: ${SMARTQ_LOGIN_MAX_FAILURES:-5}
      SMARTQ_LOGIN_WINDOW_SECONDS: ${SMARTQ_LOGIN_WINDOW_SECONDS:-900}
      SMARTQ_LOGIN_LOCK_SECONDS: ${SMARTQ_LOGIN_LOCK_SECONDS:-600}
      SMARTQ_DATA_FILE: /app/runtime/runtime.json
      SMARTQ_BACKUP_DIR: /app/runtime/backups
      SMARTQ_EVIDENCE_DIR: /app/runtime/evidence
      SMARTQ_EVIDENCE_ADAPTER: ${SMARTQ_EVIDENCE_ADAPTER:-local-file}
      SMARTQ_EVIDENCE_BUCKET: ${SMARTQ_EVIDENCE_BUCKET:-}
      SMARTQ_EVIDENCE_ENDPOINT: ${SMARTQ_EVIDENCE_ENDPOINT:-}
      SMARTQ_EVIDENCE_ACCESS_KEY_ID: ${SMARTQ_EVIDENCE_ACCESS_KEY_ID:-}
      SMARTQ_EVIDENCE_SECRET_ACCESS_KEY: ${SMARTQ_EVIDENCE_SECRET_ACCESS_KEY:-}
      SMARTQ_EVIDENCE_REGION: ${SMARTQ_EVIDENCE_REGION:-us-east-1}
      SMARTQ_EVIDENCE_PREFIX: ${SMARTQ_EVIDENCE_PREFIX:-smartq-evidence}
      SMARTQ_EVIDENCE_TIMEOUT_MS: ${SMARTQ_EVIDENCE_TIMEOUT_MS:-5000}
      SMARTQ_BACKUP_RETENTION: ${SMARTQ_BACKUP_RETENTION:-20}
      SMARTQ_BACKUP_MIN_INTERVAL_SECONDS: ${SMARTQ_BACKUP_MIN_INTERVAL_SECONDS:-60}
      SMARTQ_ONLINE_TTL_SECONDS: ${SMARTQ_ONLINE_TTL_SECONDS:-45}
      SMARTQ_PRESENCE_ADAPTER: ${SMARTQ_PRESENCE_ADAPTER:-memory}
      SMARTQ_REDIS_URL: ${SMARTQ_REDIS_URL:-}
      SMARTQ_REDIS_NAMESPACE: ${SMARTQ_REDIS_NAMESPACE:-smartq}
      SMARTQ_REDIS_TIMEOUT_MS: ${SMARTQ_REDIS_TIMEOUT_MS:-500}
      SMARTQ_MAX_REQUEST_BYTES: ${SMARTQ_MAX_REQUEST_BYTES:-2097152}
      SMARTQ_MAX_EVIDENCE_BYTES: ${SMARTQ_MAX_EVIDENCE_BYTES:-524288}
    volumes:
      - smartq-runtime:/app/runtime
    restart: unless-stopped

volumes:
  smartq-runtime:
